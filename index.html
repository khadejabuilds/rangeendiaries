<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rangeen Diaries</title>

    <!-- Typography Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="design.css">
</head>

<body>
    <div class="page-wrapper">
        <header class="navbar">
            <a href="#top" class="brand-logo">Rangeen Diaries</a>
            <nav class="nav-links">
                <a href="#shop" class="nav-link">Shop</a>
                <a href="#gallery" class="nav-link">Gallery</a>
                <a href="#journal" class="nav-link">Journal</a>
            </nav>
        </header>

        <section id="top" class="hero-section">
            <div class="hero-content">
                <h1 class="hero-title">Decor pieces where life smiles back.</h1>
                <p class="hero-description">Mehndi thaals, backdrops and details for your celebration in Multan.</p>
                <a href="https://wa.me/" class="cta-button">Order on WhatsApp</a>
            </div>
            <div aria-hidden="true" class="hero-bars">
                <div class="bar bar-green"></div>
                <div class="bar bar-magenta"></div>
                <div class="bar bar-blue"></div>
                <div class="bar bar-yellow"></div>
                <div class="bar bar-purple"></div>
            </div>
        </section>

        <section id="shop" class="shop-grid">
            <a href="#baby-shower" class="shop-card shop-card-blue">Baby shower</a>
            <a href="#mehndi" class="shop-card shop-card-green">Mehndi</a>
            <a href="#wedding" class="shop-card shop-card-purple">Wedding</a>
            <a href="#birthday" class="shop-card shop-card-yellow">Birthday</a>
        </section>

        <div class="section-separator" aria-hidden="true">
            <svg id="kashiSeparator" viewBox="0 0 1200 40" preserveAspectRatio="xMidYMid slice" height="40px"></svg>
        </div>

        <div class="section-separator" aria-hidden="true">
            <svg id="marigoldSeparator" viewBox="0 0 1200 60" preserveAspectRatio="xMidYMid slice" height="60px"></svg>
        </div>

    </div>

    <!-- Dynamic SVG Renderer -->
    <script src="script.js"></script>
</body>

</html>
