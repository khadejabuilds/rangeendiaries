<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rangeen Diaries</title>

    <!-- Typography Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="design.css">
</head>

<body>
    <div class="page-wrapper">
        <!-- Top Marigold Garland Slider with Hanging Nav Blocks -->
        <div class="marquee-separator top-garland" aria-label="Navigation Garland">
            <div class="marquee-track" id="topNavGarlandTrack">
                <!-- Dynamically populated by JS -->
            </div>
        </div>

        <!-- Center Front-Stage Splash Hero -->
        <main class="splash-container">
            <h1 class="splash-brand" id="animatedTitle">Rangeen Diaries</h1>
            <p class="splash-subtitle">Decor pieces where life smiles back. Mehndi thaals, backdrops and details for your celebration in Multan.</p>
            <a href="https://wa.me/" class="cta-button">Order on WhatsApp</a>
        </main>

        <!-- Bottom Marigold Garland Slider -->
        <div class="marquee-separator bottom-garland" aria-hidden="true">
            <div class="marquee-track" id="bottomGarlandTrack">
                <!-- Dynamically populated by JS -->
            </div>
        </div>
    </div>

    <!-- Script for Marquees & Text Animation -->
    <script src="script.js"></script>
</body>

</html>
